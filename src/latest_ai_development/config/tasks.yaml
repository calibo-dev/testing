researcher_task:
  description: >
    Extract accurate, concise, and original key points and factual notes relevant to {{topic}}, ensuring beginner-friendly coverage with a proper scope for a 600-800 word blog post.
  expected_output: >
    Research notes containing key points and factual notes with coverage status and any limitations.
  agent: researcher

writer_task:
  description: >
    Transform the Researcher's research_notes into a complete, well-structured, original blog post of 600-800 words, including an introduction, key sections, and conclusion written in clear, engaging, beginner-friendly language.
  expected_output: >
    A single blog_post that presents the full 600-800 word article covering the supplied research notes.
  agent: writer
